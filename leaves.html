<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - Leaves</title>

  <!-- Font: Poppins (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Apni CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page">

    <header class="top-bar">
      <h1>HCM Lite</h1>
      <p>Leave requests</p>
    </header>

    <!-- Navigation -->
    <nav class="nav">
      <a href="admin.html" class="nav-link">Dashboard</a>
      <a href="employees.html" class="nav-link">Employees</a>
      <a href="leaves.html" class="nav-link active">Leaves</a>
          <a href="payslip.html" class="nav-link">Payslip</a>
      <a href="settings.html" class="nav-link">Settings</a>
      <button type="button" id="logoutBtn" class="nav-link">Logout</button>
    </nav>

    <!-- Leave requests ki table -->
    <section class="card">
      <h2>Leave requests</h2>
      <p class="hint">Approve ya reject karein. Reject ke liye comment zaroori hai.</p>

      <p class="success" id="leaveAdminMsg"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th>Type</th>
              <th>Dates</th>
              <th>Din</th>
              <th>Wajah</th>
              <th>Status</th>
              <th>Comment</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="leaveAdminBody"></tbody>
        </table>
      </div>

      <p class="hint hidden" id="noLeaves">Abhi tak koi leave request nahi hai.</p>
    </section>

  </div>

  <!-- Scripts body ke aakhir mein. Order: storage, auth, leave. -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leave.js"></script>

</body>
</html>
